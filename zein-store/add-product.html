<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات - ZEIN Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Login -->
    <div class="admin-login" id="adminLogin">
        <div class="admin-login-box">
            <h2>🔐 دخول المدير</h2>
            <input type="password" id="adminPassword" placeholder="كلمة المرور">
            <button class="btn btn-primary btn-block" onclick="checkAdminPassword()">دخول</button>
            <p class="error-message" id="loginError"></p>
            <a href="index.html" class="back-link">← العودة للمتجر</a>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel" style="display:none;">
        <header class="header">
            <div class="container">
                <nav class="navbar">
                    <a href="index.html" class="logo"><span class="logo-text">ZEIN</span><span class="logo-sub">لوحة التحكم</span></a>
                    <div class="nav-actions">
                        <a href="products.html" class="btn btn-sm">عرض المنتجات</a>
                        <button class="btn btn-outline btn-sm" onclick="logout()">🚪 خروج</button>
                    </div>
                </nav>
            </div>
        </header>

        <section class="section">
            <div class="container">
                <h2 class="section-title">➕ إضافة منتج جديد</h2>
                
                <form class="add-product-form" id="addProductForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>📝 اسم المنتج (عربي) *</label>
                            <input type="text" id="productNameAr" required placeholder="مثال: جاكيت جلد أسود">
                        </div>
                        <div class="form-group">
                            <label>📝 Product Name (English) *</label>
                            <input type="text" id="productNameEn" required placeholder="Example: Black Leather Jacket">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>📂 الفئة *</label>
                            <select id="productCategory" required>
                                <option value="">اختر الفئة</option>
                                <option value="shirts">قمصان</option>
                                <option value="pants">بنطلونات</option>
                                <option value="shorts">شورتات</option>
                                <option value="jackets">جاكيتات</option>
                                <option value="shoes">أحذية</option>
                                <option value="suits">بدل</option>
                                <option value="hoodies">هودي</option>
                                <option value="sweaters">سويت شيرت</option>
                                <option value="accessories">إكسسوارات</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>🏷️ العلامة التجارية *</label>
                            <input type="text" id="productBrand" required placeholder="مثال: Zara, Nike">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>💰 السعر الحالي (ج.م) *</label>
                            <input type="number" id="productPrice" required min="0" placeholder="450">
                        </div>
                        <div class="form-group">
                            <label>💰 السعر القديم (ج.م)</label>
                            <input type="number" id="productOldPrice" min="0" placeholder="600">
                        </div>
                    </div>
                    <div class="form-row">
    <div class="form-group">
        <label>📏 المقاسات *</label>
        <div class="size-checkboxes">
            <label class="size-checkbox"><input type="checkbox" value="S" checked> S</label>
            <label class="size-checkbox"><input type="checkbox" value="M" checked> M</label>
            <label class="size-checkbox"><input type="checkbox" value="L" checked> L</label>
            <label class="size-checkbox"><input type="checkbox" value="XL" checked> XL</label>
            <label class="size-checkbox"><input type="checkbox" value="2XL" checked> 2XL</label>
            <label class="size-checkbox"><input type="checkbox" value="3XL"> 3XL</label>
            <label class="size-checkbox"><input type="checkbox" value="4XL"> 4XL</label>
            <label class="size-checkbox"><input type="checkbox" value="ONE SIZE"> ONE SIZE</label>
        </div>
    </div>
                     
                        
                        <div class="form-group">
                            <label>⭐ التقييم (1-5)</label>
                            <input type="number" id="productRating" min="1" max="5" step="0.1" value="4.5">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>📄 الوصف (عربي) *</label>
                        <textarea id="productDescAr" required rows="2" placeholder="وصف المنتج"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>📄 Description (English) *</label>
                        <textarea id="productDescEn" required rows="2" placeholder="Product description"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>🖼️ صورة المنتج *</label>
                        <input type="url" id="productImage" placeholder="https://...">
                        <div class="or-divider">أو</div>
                        <label class="file-upload-label">
                            <input type="file" id="productImageFile" accept="image/*" onchange="handleFileSelect(this)">
                            <span class="upload-btn">📁 رفع من الجهاز</span>
                        </label>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                    
                    <div class="colors-section">
                        <label>🎨 الألوان المتاحة</label>
                        <div class="color-picker-row">
                            <input type="color" id="colorPicker" value="#000000">
                            <button type="button" class="btn btn-sm" onclick="addColor()">+ إضافة لون</button>
                        </div>
                        <div class="selected-colors" id="selectedColors"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg">💾 حفظ المنتج</button>
                </form>
                
                <hr class="admin-divider">
                
                <h3 class="section-title">📦 جميع المنتجات</h3>
                <p class="admin-note">اضغط "نشر" لإظهار المنتج في المتجر - اضغط "حذف" لإزالته</p>
                <div class="products-admin-grid" id="adminProductsGrid"></div>
            </div>
        </section>
    </div>

    <div class="toast-container" id="toastContainer"></div>

        <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/products-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/add-product.js"></script>
</body>
</html>

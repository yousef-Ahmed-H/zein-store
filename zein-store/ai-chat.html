<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زين - المساعد الذكي | ZEIN Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/ai-chat-page.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body class="chat-page-body">

    <!-- Header -->
    <header class="chat-page-header">
        <a href="index.html" class="chat-back-btn" title="العودة للرئيسية">←</a>
        <div class="chat-page-title">
            <div class="chat-page-avatar">🤖</div>
            <div>
                <h1>زين</h1>
                <p><span class="online-dot"></span> متصل الآن</p>
            </div>
        </div>
        <button class="chat-page-clear" onclick="clearChatPage()" title="محادثة جديدة">🔄</button>
    </header>

    <!-- Messages Area -->
    <main class="chat-page-messages" id="chatMessages"></main>

    <!-- Quick Replies -->
    <div class="chat-page-quick" id="chatQuickReplies">
        <button onclick="sendQuickReply('عايز قميص')">👔 قميص</button>
        <button onclick="sendQuickReply('إيه سياسة الشحن؟')">🚚 الشحن</button>
        <button onclick="sendQuickReply('إيه سياسة الإرجاع؟')">🔄 الإرجاع</button>
        <button onclick="sendQuickReply('عايز أتواصل مع حد')">💬 تواصل</button>
    </div>

    <!-- Input Area -->
    <footer class="chat-page-input-wrap">
        <div class="chat-page-input-box">
            <button class="chat-page-mic" id="chatMicBtn" onclick="toggleMicPage()" title="اتكلم">🎤</button>
            <textarea 
                id="chatInput" 
                class="chat-page-input" 
                rows="1"
                placeholder="اكتب أو اتكلم..."
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitChat();}"
                oninput="autoResize(this)"
            ></textarea>
            <button class="chat-page-send" id="chatSendBtn" onclick="submitChat()" title="إرسال">
                <span>➤</span>
            </button>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase + AI Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/products-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ai-chat-page.js"></script>
</body>
</html>
